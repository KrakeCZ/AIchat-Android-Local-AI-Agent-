name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Typ sestavení (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: examples/llama.android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
          link-to-sdk: true

      - name: Configure Android SDK & NDK Links
        run: |
          echo "Konfigurace NDK pro Android Gradle Plugin..."
          mkdir -p "$ANDROID_HOME/ndk"
          # Vytvoření symlinků pro přesnou shodu s ndkVersion deklarovanou v Gradle skriptech
          ln -sfn "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk/29.0.13846066 rc3"
          ln -sfn "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk/29.0.13846066"
          ln -sfn "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk/29.0.13846066-beta3"
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Patch CI Configuration & Memory Limits
        run: |
          echo "Optimalizace gradle.properties a CMake pro CI runner (7GB RAM)..."
          # 1. Odstranit lokální Windows cesty na Android Studio JBR
          sed -i '/org.gradle.java.installations.paths/d' gradle.properties

          # 2. Upravit limity RAM pro GitHub Actions runner (prevence OOM killeru)
          sed -i 's/-Xmx10g/-Xmx4096m/g' gradle.properties
          sed -i 's/-Xmx6g/-Xmx2048m/g' gradle.properties
          sed -i 's/org.gradle.workers.max=4/org.gradle.workers.max=2/g' gradle.properties

          # 3. Odstranit IDE specifický daemon JVM soubor, aby Gradle použil nainstalovaný JDK 21
          rm -f gradle/gradle-daemon-jvm.properties

          # 4. Nahradit Windows cestu k shader kompilátoru glslc v whisper CMakeLists na systémový NDK glslc
          if [ -f "whisper/src/main/cpp/CMakeLists.txt" ]; then
            sed -i 's|set(Vulkan_GLSLC_EXECUTABLE "C:/.*glslc\.exe".*)|set(Vulkan_GLSLC_EXECUTABLE "$ENV{ANDROID_NDK_HOME}/shader-tools/linux-x86_64/glslc" CACHE FILEPATH "Path to glslc")|g' whisper/src/main/cpp/CMakeLists.txt
          fi

      - name: Download AI Models for Assets Check
        run: |
          chmod +x scripts/download_models.sh
          ./scripts/download_models.sh

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "Spouštím kompilaci: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Chat-Android-APKs
          path: examples/llama.android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
