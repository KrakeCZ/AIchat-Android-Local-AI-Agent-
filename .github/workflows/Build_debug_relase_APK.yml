name: Build Llama Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/llama.android/**"
      - ".github/workflows/Build_debug_relase_APK.yml"

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: examples/llama.android

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}\android-sdk
      ANDROID_HOME: ${{ github.workspace }}\android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = "$env:ANDROID_SDK_ROOT"
          if (-not (Test-Path $sdkRoot)) {
            New-Item -ItemType Directory -Path $sdkRoot | Out-Null
          }

          $sdkManager = "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            $sdkManager = "$sdkRoot\cmdline-tools\bin\sdkmanager.bat"
          }

          if (-not (Test-Path $sdkManager)) {
            Write-Error "sdkmanager not found at $sdkManager"
            exit 1
          }

          & $sdkManager --sdk_root="$sdkRoot" --licenses
          & $sdkManager --sdk_root="$sdkRoot" `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;36.1.0" `
            "cmake;3.22.1" `
            "ndk;29.0.13846066"

          "sdk.dir=$sdkRoot" | Set-Content -Path "local.properties"

      - name: Download required AI model assets
        shell: bash
        run: |
          set -e
          chmod +x ./scripts/download_models.sh || true
          ./scripts/download_models.sh

      - name: Build debug APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-debug-apk-windows
          path: |
            examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
            examples/llama.android/app/build/outputs/apk/debug/*.apk
