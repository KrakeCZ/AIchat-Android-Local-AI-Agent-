name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch: # Umožní ruční spuštění přes GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    # Výchozí složka pro všechny run příkazy
    defaults:
      run:
        working-directory: examples/llama.android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ignore IDE specific daemon JVM settings
      run: rm -f gradle/gradle-daemon-jvm.properties

    - name: Grant execute permissions for scripts
      run: |
        chmod +x gradlew
        chmod +x scripts/download_models.sh

    - name: Download required AI models
      run: ./scripts/download_models.sh

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
