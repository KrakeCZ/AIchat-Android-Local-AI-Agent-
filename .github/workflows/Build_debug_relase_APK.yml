name: Build Llama Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/llama.android/**"
      - ".github/workflows/Build_debug_relase_APK.yml"

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: examples/llama.android

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}\android-sdk
      ANDROID_HOME: ${{ github.workspace }}\android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK manually
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (-not (Test-Path $sdkRoot)) {
            New-Item -ItemType Directory -Path $sdkRoot | Out-Null
          }

          $zipUrl = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "cmdline-tools.zip"
          $extractRoot = $env:RUNNER_TEMP

          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath

          if (Test-Path (Join-Path $extractRoot "cmdline-tools")) {
            Remove-Item (Join-Path $extractRoot "cmdline-tools") -Recurse -Force
          }

          if (Test-Path (Join-Path $extractRoot "cmdline-tools-win")) {
            Remove-Item (Join-Path $extractRoot "cmdline-tools-win") -Recurse -Force
          }

          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $candidate = $null

          if (Test-Path (Join-Path $extractRoot "cmdline-tools")) {
            $candidate = (Join-Path $extractRoot "cmdline-tools")
          }
          elseif (Test-Path (Join-Path $extractRoot "cmdline-tools-win")) {
            $candidate = (Join-Path $extractRoot "cmdline-tools-win")
          }
          elseif (Test-Path (Join-Path $extractRoot "cmdline-tools-linux")) {
            $candidate = (Join-Path $extractRoot "cmdline-tools-linux")
          }

          if (-not $candidate) {
            Write-Error "Command line tools directory not found after extraction"
            Get-ChildItem $extractRoot -Force | Select-Object FullName
            exit 1
          }

          if (Test-Path (Join-Path $sdkRoot "cmdline-tools")) {
            Remove-Item (Join-Path $sdkRoot "cmdline-tools") -Recurse -Force
          }

          New-Item -ItemType Directory -Path (Join-Path $sdkRoot "cmdline-tools") -Force | Out-Null

          Move-Item $candidate (Join-Path $sdkRoot "cmdline-tools\latest")

          $sdkManager = Join-Path $sdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            Write-Error "sdkmanager not found at $sdkManager"
            exit 1
          }

          & $sdkManager --sdk_root="$sdkRoot" --licenses
          & $sdkManager --sdk_root="$sdkRoot" `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;36.1.0" `
            "cmake;3.22.1" `
            "ndk;29.0.13846066"

          "sdk.dir=$sdkRoot" | Set-Content -Path "local.properties"

      - name: Download required AI model assets
        shell: bash
        run: |
          set -e
          chmod +x ./scripts/download_models.sh || true
          ./scripts/download_models.sh

      - name: Build debug APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-debug-apk-windows
          path: |
            examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
            examples/llama.android/app/build/outputs/apk/debug/*.apk
