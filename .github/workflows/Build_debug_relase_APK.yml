name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch: # Umožní ruční spuštění přes GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    # Výchozí složka pro všechny run příkazy
    defaults:
      run:
        working-directory: examples/llama.android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # VELMI DŮLEŽITÉ pro stažení Vulkan-Headers a llama.cpp/whisper.cpp

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ignore IDE specific daemon JVM settings
      run: rm -f gradle/gradle-daemon-jvm.properties

    - name: Grant execute permissions for scripts
      run: |
        chmod +x gradlew
        chmod +x scripts/download_models.sh

    - name: Download required AI models
      run: ./scripts/download_models.sh

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Vulkan shader compiler (glslc)
      run: sudo apt-get update && sudo apt-get install -y glslc

    - name: Patch local Windows paths for CI Linux environment
      run: |
        # Opraví hardcodovanou Java cestu v gradle.properties na CI $JAVA_HOME
        sed -i 's|C:/Program Files/Android/Android Studio/jbr|'"$JAVA_HOME"'|g' gradle.properties
        # Nahradí Windows NDK glslc cestu systémovou linuxovou glslc binárkou
        sed -i 's|C:/Users/x/AppData/Local/Android/Sdk/ndk/29.0.13846066/shader-tools/windows-x86_64/glslc.exe|/usr/bin/glslc|g' whisper/src/main/cpp/CMakeLists.txt

    - name: Prevent Out-Of-Memory by limiting Ninja jobs
      run: |
        # Gradle běžně stahuje CMake 3.22.1 až uvnitř buildu. Abychom mohli Ninja upravit předem,
        # musíme si CMake vyžádat ze SDK manageru rovnou tady:
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

        # Nyní už soubor existuje a vytvoříme wrapper pro ninja, aby vždy běžel jen se 2 vlákny (-j 2)
        NINJA_PATH="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
        sudo mv "$NINJA_PATH" "$NINJA_PATH.real"
        echo '#!/bin/bash' | sudo tee "$NINJA_PATH"
        echo 'exec "'"$NINJA_PATH.real"'" -j 2 "$@"' | sudo tee -a "$NINJA_PATH"
        sudo chmod +x "$NINJA_PATH"

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-parallel -Porg.gradle.workers.max=1 --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
