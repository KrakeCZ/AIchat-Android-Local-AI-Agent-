name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch: # Umožní ruční spuštění přes GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    # Výchozí složka pro všechny run příkazy
    defaults:
      run:
        working-directory: examples/llama.android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # VELMI DŮLEŽITÉ pro stažení Vulkan-Headers a llama.cpp/whisper.cpp
        lfs: true # NEZBYTNÉ pro stažení reálných souborů jako sherpa-onnx-1.12.34.aar

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ignore IDE specific daemon JVM settings
      run: rm -f gradle/gradle-daemon-jvm.properties

    - name: Grant execute permissions for scripts
      run: |
        chmod +x gradlew
        chmod +x scripts/download_models.sh

    - name: Download required AI models
      run: ./scripts/download_models.sh

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Vulkan shader compiler (glslc)
      run: sudo apt-get update && sudo apt-get install -y glslc

    - name: Patch local Windows paths for CI Linux environment
      run: |
        # Opraví hardcodovanou Java cestu v gradle.properties na CI $JAVA_HOME
        sed -i 's|C:/Program Files/Android/Android Studio/jbr|'"$JAVA_HOME"'|g' gradle.properties
        # Nahradí Windows NDK glslc cestu systémovou linuxovou glslc binárkou
        sed -i 's|C:/Users/x/AppData/Local/Android/Sdk/ndk/29.0.13846066/shader-tools/windows-x86_64/glslc.exe|/usr/bin/glslc|g' whisper/src/main/cpp/CMakeLists.txt
        # ÚPLNĚ SMAŽE CLEAN ROOM WORKAROUND na Linuxu (protože v něm zůstalo include(ExternalProject), které narušovalo generátor)
        sed -i '/# --- CLEAN ROOM WORKAROUND FOR GGML-VULKAN ON WINDOWS ---/,/# --------------------------------------------------------/d' whisper/src/main/cpp/CMakeLists.txt

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
