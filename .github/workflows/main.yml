name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: examples/llama.android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ignore IDE specific daemon JVM settings
      run: Remove-Item -Force -ErrorAction SilentlyContinue gradle/gradle-daemon-jvm.properties

    - name: Patch gradle.properties for CI
      run: |
        # Nahradí tvou lokální cestu na GitHub Actions Java cestu, aby Gradle nehledal neexistující složku na CI
        $ciJava = $env:JAVA_HOME -replace '\\', '/'
        (Get-Content gradle.properties) -replace 'C:/Program Files/Android/Android Studio/jbr', $ciJava | Set-Content gradle.properties

    - name: Accept Android SDK licenses
      shell: bash
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat --licenses || true

    - name: Download required AI models
      run: .\scripts\download_models.ps1

    - name: Build with Gradle
      run: .\gradlew.bat assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
