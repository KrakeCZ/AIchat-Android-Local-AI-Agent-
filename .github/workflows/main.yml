name: Build Android Debug APK

on:
  push:
    branches: ["main", "master"]
    paths:
      - "examples/llama.android/**"
      - ".github/workflows/Build_debug_relase_APK.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "examples/llama.android/**"
      - ".github/workflows/Build_debug_relase_APK.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: examples/llama.android

    env:
      ANDROID_HOME: C:\Android\android-sdk
      ANDROID_SDK_ROOT: C:\Android\android-sdk
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dkotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Install Android commandline tools manually
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "$env:ANDROID_HOME" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:ANDROID_HOME\cmdline-tools" | Out-Null

          if (-not (Test-Path "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat")) {
            $zip = "$env:RUNNER_TEMP\cmdline-tools.zip"
            Invoke-WebRequest `
              -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" `
              -OutFile $zip

            Expand-Archive -Path $zip -DestinationPath "$env:ANDROID_HOME\cmdline-tools" -Force

            if (Test-Path "$env:ANDROID_HOME\cmdline-tools\cmdline-tools") {
              Move-Item "$env:ANDROID_HOME\cmdline-tools\cmdline-tools" "$env:ANDROID_HOME\cmdline-tools\latest" -Force
            }
          }

      - name: Accept Android licenses and install SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            --sdk_root="$env:ANDROID_HOME" --licenses

          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            --sdk_root="$env:ANDROID_HOME" `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "cmake;3.22.1" `
            "ndk;29.0.13846066"

      - name: Prepare repo for Windows CI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item -Force gradle/gradle-daemon-jvm.properties -ErrorAction SilentlyContinue

          $ndkRoot = Join-Path $env:ANDROID_HOME "ndk\29.0.13846066"
          $glslcPath = Join-Path $ndkRoot "shader-tools\windows-x86_64\glslc.exe"

          if (Test-Path "gradle.properties") {
            (Get-Content gradle.properties) `
              -replace 'C:/Program Files/Android/Android Studio/jbr', $env:JAVA_HOME `
              | Set-Content gradle.properties
          }

          if (Test-Path "whisper/src/main/cpp/CMakeLists.txt") {
            $content = Get-Content "whisper/src/main/cpp/CMakeLists.txt" -Raw
            $content = $content -replace 'C:/Users/x/AppData/Local/Android/Sdk/ndk/29.0.13846066/shader-tools/windows-x86_64/glslc.exe', $glslcPath
            $content = $content -replace '(?s)# --- CLEAN ROOM WORKAROUND FOR GGML-VULKAN ON WINDOWS ---.*?# --------------------------------------------------------', ''
            Set-Content "whisper/src/main/cpp/CMakeLists.txt" $content
          }

      - name: Download required AI models
        shell: pwsh
        run: |
          bash ./scripts/download_models.sh

      - name: Build with Gradle
        shell: pwsh
        run: |
          .\gradlew.bat assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
