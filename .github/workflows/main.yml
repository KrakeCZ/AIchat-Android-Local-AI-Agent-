name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'examples/llama.android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: examples/llama.android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: echo y | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses

    - name: Download required AI models
      run: .\scripts\download_models.ps1

    - name: Build with Gradle
      run: .\gradlew.bat assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
