# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Optimalizace pro tezke NDK buildy (Llama.cpp vyzaduje hodne RAM)
# Zvysujeme Heap na 4GB (nebo vice, pokud mate 32GB RAM, dejte 6g)
org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Povolen� paraleln�ho behu a cachov�n�
org.gradle.parallel=true
org.gradle.caching=false
# Vypnout Kotlin daemon cache (voliteln�)
kotlin.incremental=true
org.gradle.daemon=true

# Zabranuje Kotlin daemonu, aby se pokousel kompilovat v procesu Gradle, pokud dojde pamet
kotlin.compiler.execution.strategy=daemon

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

android.native.buildOutput=verbose

# Suppress warning about compileSdk 36 with AGP 8.7.2
android.suppressUnsupportedCompileSdk=36

# Optimizing Kotlin compilation
# FIX: Correct property name from kotlin.daemon.jvm.options to kotlin.daemon.jvmargs
# FIX: Increased memory to 4g to prevent daemon connection failure
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# configuration-cache=false: nestabilni s Kotlin daemon pri NDK buildu
org.gradle.configuration-cache=false
# Omezeni poctu paralelni NDK workeru aby neuvolnili vsechnu RAM
org.gradle.workers.max=4


# --- Fix Java Toolchain (Zabraneni zamrznuti stahovani Foojay) ---
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
#org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
